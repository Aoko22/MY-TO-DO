<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO-DO LIST</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="greeting">
    <h1>Hi Loureen 👋</h1>
    <p>What are we doing today?</p>
</div>

<div class="datetime">
    <h2 id="day"></h2>
    <p id="date"></p>
    <p id="time"></p>
</div>

        <div class="input-area">
            <input type="text" id="taskInput" placeholder="Enter a task!">
            <button id="addBtn">ADD</button>
        </div>
            <p id="progress">0 of 0 tasks completed</p>

        <ol id="taskList"></ol>
         <div class="actions">
    <button id="clearAllBtn">Clear All 🗑️</button>
</div>

    <script src="script.js"></script>

</body>
</html>
